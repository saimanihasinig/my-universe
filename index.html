
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Universe</title>
    <link rel="manifest" href="./manifest.json">

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Website Heading -->
    <h1>My Universe 🌷</h1>
    <p>Welcome to my personal space.</p>

    <hr>

    <!-- Calendar Section -->
    <section id="calendarSection">
        <h2>My Calendar 🗓️</h2>

        <div id="calendarHeader">
            <button id="prevMonthBtn" type="button">❮</button>
            <button id="calendarMonth" type="button">
                October 2026
            </button>
            <button id="nextMonthBtn" type="button">❯</button>
            <button id="todayBtn" type="button">Today 🌷</button>
        </div>

        <div id="calendarGrid"></div>
    </section>

    
    <!-- Jump to Date Popup -->
    <div id="datePickerModal" class="date-picker-modal" hidden>
        <div class="date-picker-box">
            <h2>Jump to</h2>

            <p id="chosenDatePreview">Select a date</p>

            <div id="customDatePicker">

                <!-- DAY PICKER -->
                <div class="date-picker-column">
                    <label for="jumpDayBtn">Day</label>

                    <div class="custom-picker">
                        <button id="jumpDayBtn" class="picker-button"
                                type="button" aria-expanded="false"
                                aria-controls="dayOptions">
                            <span id="jumpDayLabel">13</span>
                            <span aria-hidden="true">⌄</span>
                        </button>

                        <div id="dayOptions" class="picker-options" hidden></div>
                    </div>
                </div>

                <!-- MONTH PICKER -->
                <div class="date-picker-column">
                    <label for="jumpMonthBtn">Month</label>

                    <div class="month-picker">
                        <button id="jumpMonthBtn" type="button"
                                aria-expanded="false" aria-controls="monthOptions">
                            <span id="jumpMonthLabel">October</span>
                        <span aria-hidden="true">⌄</span>
                        </button>

                        <div id="monthOptions" class="month-options" hidden></div>
                    </div>
                </div>

                <!-- YEAR PICKER -->
                <div class="date-picker-column">
                    <label for="jumpYearBtn">Year</label>

                    <div class="custom-picker">
                        <button id="jumpYearBtn" class="picker-button"
                                type="button" aria-expanded="false"
                                aria-controls="yearOptions">
                            <span id="jumpYearLabel">2026</span>
                            <span aria-hidden="true">⌄</span>
                        </button>

                        <div id="yearOptions" class="picker-options" hidden></div>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="date-picker-actions">
                <button id="cancelDateBtn" type="button">
                    Cancel
                </button>

                <button id="confirmDateBtn" type="button">
                    OK
                </button>
            </div>
        </div>
    </div>


    <hr>

    <!-- Today's Tasks Section -->
    <section id="tasksSection">
    <h2 id="tasksHeading">Today's Tasks</h2>
        <input
            id="taskInput"
            type="text"
            placeholder="What do you need to do?"
        >

        <button id="addTaskBtn">Add Task</button>

        <ul id="taskList"></ul>
    </section>

    <hr>

    <!-- Habits Section -->
    <section id="habitsSection">
        <h2>My Habits 🌱</h2>

        <div id="habitForm">

            <input
                id="habitInput"
                type="text"
                placeholder="What habit do you want to build?"
            >

            <label for="habitSchedule">Repeat:</label>

            <select id="habitSchedule">
                <option value="daily">Every day</option>
                <option value="selectedDays">Selected weekdays</option>
                <option value="weekly">Once a week</option>
                <option value="interval">Every few days</option>
            </select>

            <!-- Schedule options will appear here -->
            <div id="habitScheduleOptions"></div>

            <button id="addHabitBtn">Add Habit 🌷</button>

        </div>

        <!-- Saved habits will appear here -->
        <ul id="habitList"></ul>
    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>
    
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(function() {
                        console.log("My Universe offline support is ready! 🌷");
                    })
                    .catch(function(error) {
                        console.error("Service worker registration failed:", error);
                    });
            });
        }
    </script>
</body>

</html>
